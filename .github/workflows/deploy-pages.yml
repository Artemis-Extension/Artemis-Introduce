name: GitHub Pages 배포

# main 에 푸시하면 정적 사이트를 만들어 Pages 에 올린다.
# 서버 런타임이 없는 사이트라 빌드 산출물(.output/public)을 그대로 서빙한다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# deploy-pages 가 요구하는 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 된다. 진행 중인 배포는 끝까지 두고 대기시킨다.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages 설정 읽기
        id: pages
        uses: actions/configure-pages@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 타입 검사
        run: pnpm typecheck

      - name: 정적 생성
        run: pnpm build
        env:
          # 프로젝트 사이트는 /<저장소명>/ 아래에서 서빙된다. 끝의 / 가 없으면 /_nuxt/... 가 전부 404 난다
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # 링크 미리보기(og:image)의 절대 주소 기준
          NUXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - name: 산출물 업로드
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    name: 배포
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
